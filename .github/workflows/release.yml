name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-pypi:
    name: Release (PyPI)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PDM
        uses: pdm-project/setup-pdm@v4.4
      - name: Build Distribution(s)
        run: pdm build --no-sdist
      - name: Publish Distribution(s)
        run: pdm publish --no-build
